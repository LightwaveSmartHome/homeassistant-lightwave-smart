rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: >-
      The integration is cloud_push. Entities do not poll. The Cloud Link
      sensor refreshes its last-event attribute once a minute and does not
      poll the Lightwave cloud.
  brands:
    status: todo
    comment: >-
      Icon and logo are submitted with the Home Assistant brands pull request.
      The files under brand/ are the custom-component copies only.
  common-modules:
    status: done
    comment: >-
      The shared entity is in entity.py. There is no DataUpdateCoordinator.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      lightwave_smart 2.0.8 is the PyPI package lightwave-smart, built and
      published by LightwaveSmartHome/lightwave-smart
      .github/workflows/publish-pypi.yaml.
  docs-actions:
    status: todo
    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  docs-conditions:
    status: exempt
    comment: The integration does not define its own conditions.
  docs-high-level-description:
    status: todo
    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  docs-installation-instructions:
    status: todo
    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  docs-removal-instructions:
    status: todo
    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  docs-triggers:
    status: exempt
    comment: The integration does not define its own triggers. Button presses are event entities.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: todo
    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  docs-installation-parameters:
