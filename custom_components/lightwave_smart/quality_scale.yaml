    comment: Documented on the home-assistant.io page that ships with the Core pull request.
  entity-unavailable: done
  integration-owner:
    status: done
    comment: manifest.json codeowners lists @ikb42. The Core CODEOWNERS line is added with the Core pull request.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

